# ──────────────────────────────────────────────────────────────────────
# Terraform Drift Detection — reference workflow
#
# THIS IS A TEMPLATE, meant to be copied into the repository that holds your
# Terraform. Copy it, set the cron you want, and point CONFIG_FILE at a
# config.yaml describing your targets. See "Running on a schedule" in the
# README.
#
# It lives in examples/ rather than .github/workflows/ and has no schedule of
# its own, on purpose. This repository ships the tool, not any Terraform:
# config.yaml is gitignored, the infrastructure/ paths in config.example.yaml
# do not exist here, and there are no AWS credentials. Left in
# .github/workflows/ it would be a workflow that can only fail, with a status
# badge to match. Testing the detector itself is what ci.yml is for - flake8,
# mypy and pytest against the package.
#
# To use it: copy this file into .github/workflows/ of the repository that
# holds your Terraform, add a schedule: block, and set CONFIG_FILE.
#
# workflow_dispatch is kept so the workflow can still be exercised by hand.
# ──────────────────────────────────────────────────────────────────────
name: Drift Detection

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: "Path to drift detection config file"
        required: false
        default: "config.yaml"
      notify_slack:
        description: "Send Slack notification on drift"
        required: false
        type: boolean
        default: true
      create_issue:
        description: "Create GitHub Issue on drift"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

env:
  PYTHON_VERSION: "3.11"
  CONFIG_FILE: ${{ github.event.inputs.config_file || 'config.yaml' }}

jobs:
  drift-detection:
    name: Run Drift Detection
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Validate configuration
        run: |
          if [ ! -f "${{ env.CONFIG_FILE }}" ]; then
            echo "::error::Configuration file not found: ${{ env.CONFIG_FILE }}"
            exit 1
          fi
          echo "Configuration file found: ${{ env.CONFIG_FILE }}"

      - name: Run drift detection
        id: detect
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
          TF_IN_AUTOMATION: "true"
        run: |
          # Run detection and capture output
          scripts/run-drift-check.sh \
            --config "${{ env.CONFIG_FILE }}" \
            --output-format json \
            --output-file drift-results.json \
            --exit-code || EXIT_CODE=$?

          EXIT_CODE=${EXIT_CODE:-0}
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 2 ]; then
            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Infrastructure drift detected!"
          elif [ "$EXIT_CODE" -eq 0 ]; then
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
            echo "No drift detected."
          else
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
            echo "::error::Drift detection encountered an error"
            exit 1
          fi

      - name: Generate Markdown report
        if: steps.detect.outputs.drift_detected == 'true'
        run: |
          drift-detector report \
            --input drift-results.json \
            --format markdown \
            --output-file drift-report.md
          echo "--- Drift Report ---"
          cat drift-report.md

      - name: Create GitHub Issue
        if: >
          steps.detect.outputs.drift_detected == 'true' &&
          (github.event.inputs.create_issue != 'false')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m detector.notifiers.github_notifier \
            --results drift-results.json \
            --repo "${{ github.repository }}"

      - name: Send Slack notification
        if: >
          steps.detect.outputs.drift_detected == 'true' &&
          (github.event.inputs.notify_slack != 'false')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            drift-detector detect \
              --config "${{ env.CONFIG_FILE }}" \
              --notify slack
          else
            echo "::warning::SLACK_WEBHOOK_URL not set, skipping Slack notification"
          fi

      - name: Upload drift results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-results-${{ github.run_number }}
          path: |
            drift-results.json
            drift-report.md
          retention-days: 30
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## Drift Detection Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.detect.outputs.drift_detected }}" == "true" ]; then
            echo "⚠️ **Drift detected** — see the created GitHub Issue for details." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [ -f drift-report.md ]; then
              cat drift-report.md >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "✅ **No drift detected** across all configured targets." >> "$GITHUB_STEP_SUMMARY"
          fi
